name: Publish npm packages
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "publish" after reviewing the synced commit and CI
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >=11.5.1. Keep this exact for reproducibility.
      - run: npm install --global npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm pack-check
      - name: Show unpublished versions
        run: node scripts/publish-public-packages.mjs --dry-run
      - name: Publish unpublished versions with provenance
        run: node scripts/publish-public-packages.mjs
        env:
          NPM_CONFIG_PROVENANCE: "true"
